# Ubuntu 只运行格式检查和类型检查。
# 这不是 Linux native 支持：不运行 moon test，不加载 ONNX Runtime，不运行 Laya。
# macOS arm64 的 native 测试在 macos-arm64.yml，不在本 job。

name: static

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ubuntu-static:
    name: Ubuntu format and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit 0.1.20260915
        run: curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- 0.1.20260915
      - name: Put moon on PATH
        run: echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: moon fmt --check
        run: moon fmt --check
      - name: moon check --deny-warn
        run: moon check --deny-warn
